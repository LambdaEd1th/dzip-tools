[package]
name = "dzip-gui"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
authors = ["LambdaEd1th"]
description = "Native Shell desktop and Web archive manager for Dzip files"

[package.metadata.bundle]
name = "Dzip Archive"
identifier = "dev.lambdaedith.dzip"
# The directory link preserves the bundle path while NSH reads the same files from locales/.
resources = ["assets/locales/*.toml"]
category = "public.app-category.utilities"
short_description = "A modern Dzip archive manager"
long_description = "Open, inspect, extract, and create Dzip archives from one cross-platform interface."

[package.metadata.bundle.bin.dzip-gui]
name = "Dzip Archive"
identifier = "dev.lambdaedith.dzip"
resources = ["assets/locales/*.toml"]
category = "public.app-category.utilities"
short_description = "A modern Dzip archive manager"
long_description = "Open, inspect, extract, and create Dzip archives from one cross-platform interface."

[[bin]]
name = "dzip-gui"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
nsh-core = { version = "=0.7.1", features = ["svg"] }
nsh-base = { version = "=0.7.1", default-features = false }
dzip.workspace = true
dzip-workflow = { workspace = true, features = ["protocol"] }
futures-channel = "0.3"
futures-util = "0.3"
log.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true

[build-dependencies]
nsh-i18n = { version = "=0.7.1", features = ["build"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-apple = { version = "=0.7.1", default-features = false }
nsh-platform-macos = { version = "=0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dzip-workflow = { workspace = true, features = ["parallel"] }
nsh-engine = { version = "=0.7.1", default-features = false }
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "Node",
    "Blob",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DragEvent",
    "ErrorEvent",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[features]
default = ["desktop"]
bundle = []
desktop = []
web = []
